<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Browse Puzzles — Arrow Word Puzzle Builder</title>
<script src="staging-safety.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f5f5f5;color:#222;min-height:100vh}
header{background:#7744bb;color:#fff;padding:14px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header h1{font-size:20px;font-weight:700;flex:1}
header a{color:#fff;text-decoration:none;font-size:13px;background:rgba(255,255,255,0.2);border-radius:6px;padding:6px 12px;white-space:nowrap}
header a:hover{background:rgba(255,255,255,0.35)}
.container{max-width:960px;margin:0 auto;padding:20px 16px}
.subtitle{font-size:14px;color:#666;margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{background:#fff;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,0.08);padding:18px;display:flex;flex-direction:column;gap:10px;border-top:4px solid #9966cc}
.card-title{font-size:16px;font-weight:700;color:#333;line-height:1.3}
.card-meta{font-size:12px;color:#888;display:flex;flex-direction:column;gap:3px}
.card-meta span{display:flex;align-items:center;gap:4px}
.play-btn{display:block;background:#7744bb;color:#fff;border:none;border-radius:7px;padding:10px 14px;font-size:14px;font-weight:600;text-align:center;cursor:pointer;text-decoration:none;margin-top:auto}
.play-btn:hover{background:#6633aa}
.empty{text-align:center;padding:60px 20px;color:#888}
.empty-icon{font-size:48px;margin-bottom:12px}
.empty h2{font-size:18px;margin-bottom:8px;color:#555}
.empty p{font-size:14px;line-height:1.5}
.loading{text-align:center;padding:60px;color:#999;font-size:16px}
.count-badge{font-size:13px;font-weight:600;color:#7744bb;margin-bottom:12px}
@media(max-width:480px){header h1{font-size:17px}}
</style>
</head>
<body>
<header>
  <h1>🧩 Puzzle Library</h1>
  <a href="index.html">← Back to Builder</a>
</header>
<div class="container">
  <p class="subtitle">All puzzles published here — click Play to start solving!</p>
  <div id="count-line" class="count-badge" style="display:none"></div>
  <div id="content" class="loading">Loading puzzles…</div>
</div>

<script src="cloud-storage.js"></script>
<script>
async function load(){
  try{
    const puzzles=await cloudGetIndex();
    const content=document.getElementById('content');
    const countEl=document.getElementById('count-line');
    if(!puzzles.length){
      content.innerHTML='<div class="empty"><div class="empty-icon">📭</div><h2>No puzzles yet</h2><p>Open the builder, design a puzzle, and tap <strong>Share online</strong> to publish it here for everyone to play!</p></div>';
      return;
    }
    countEl.textContent=puzzles.length+' puzzle'+(puzzles.length===1?'':'s')+' published';
    countEl.style.display='block';
    content.innerHTML='<div class="grid">'+puzzles.map(p=>{
      const date=p.publishedAt?new Date(p.publishedAt).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):'';
      return '<div class="card">'
        +'<div class="card-title">'+esc(p.title)+'</div>'
        +'<div class="card-meta"><span>📅 '+date+'</span></div>'
        +'<a class="play-btn" href="directory.html?id='+encodeURIComponent(p.id)+'">▶ Play this puzzle</a>'
        +'</div>';
    }).join('')+'</div>';
  }catch(e){
    document.getElementById('content').innerHTML='<div class="empty"><div class="empty-icon">⚠️</div><h2>Could not load puzzles</h2><p>'+e.message+'</p></div>';
  }
}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
load();
</script>
</body>
</html>
