<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Dedicated cloud-connected solver. Keep solver UI and behavior in this page. -->
<title>Arrow Word Solver</title>
<link rel="icon" href="favicon.png">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#f5f0ff;color:#222;font-family:Arial,sans-serif}
nav{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:#7744bb;color:#fff;padding:12px 24px}
.brand{color:#fff;text-decoration:none;font-size:20px;font-weight:700}.brand span{color:#e8d8ff}
.nav-right{display:flex;align-items:center;gap:12px}
.nav-user{display:none;align-items:center;gap:8px}
.nav-user img{width:26px;height:26px;border-radius:50%;object-fit:cover}
.nav-user span{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.nav-user button,.nav-signin{border:0;border-radius:14px;padding:5px 10px;color:#fff;background:#ffffff2b;cursor:pointer}
main{max-width:1040px;margin:20px auto;padding:0 16px}
.solver-box{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 12px #44336618}
.solver-header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:#7744bb;color:#fff;padding:12px 18px}
.solver-header h1{font-size:18px;margin:0;font-weight:700}
.solver-close{border:0;border-radius:6px;padding:7px 14px;background:#ffffff2b;color:#fff;cursor:pointer;font-size:13px;font-weight:600}
.solver-timer{font-size:13px;color:#e8d8ff;background:#0003;padding:4px 10px;border-radius:12px;font-variant-numeric:tabular-nums;min-width:60px;text-align:center}
.solver-body{padding:14px}
.solve-toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.solve-toolbar-left,.solve-toolbar-right{display:flex;gap:6px;flex-wrap:wrap}
.solve-toolbar button{padding:7px 13px;font-size:13px;cursor:pointer;border:1px solid #bbb;border-radius:5px;background:#fff}
.solve-toolbar button:hover{background:#eee}
.solve-toolbar button.green{background:#d4f0d4;color:#1a6e1a;border-color:#7bc07b}
.solve-toolbar button.blue{background:#d0e8ff;color:#004a99;border-color:#6aaae0;font-weight:600}
.solve-toolbar button.warn{background:#ffe0e0;color:#900;border-color:#f4a8a8}
.solve-toolbar button.orange{background:#ffe8cc;color:#8b4513;border-color:#ffb366}
.zoom-bar{display:flex;align-items:center;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.zoom-bar span{font-size:12px;color:#666}
.zoom-bar button{padding:5px 10px;font-size:12px;cursor:pointer;border:1px solid #bbb;border-radius:4px;background:#fff;min-width:34px}
.grid-wrap{overflow:auto;-webkit-overflow-scrolling:touch;border:1px solid #e0e0e0;background:#f9f9f9;border-radius:6px;padding:6px;margin-bottom:8px}
table.puzzle{border-collapse:collapse;table-layout:fixed}
table.puzzle td{border:1px solid #aaa;position:relative;user-select:none;padding:0;overflow:hidden;vertical-align:top}
td.t-empty{background:#fff}td.t-black{background:#333}td.t-clue{background:#e8e0f0;cursor:pointer}td.t-clue:hover{background:#ddd0ee}
td.t-answer{background:#eaf5e4;vertical-align:middle;text-align:center}
.answer-arrow-marker{position:absolute;display:block;width:var(--arrow-size);height:var(--arrow-size);z-index:2;pointer-events:none;line-height:0}
.answer-arrow-marker svg{display:block;width:100%;height:100%}
.answer-arrow-marker.edge-left{left:1px;top:var(--slot-position);transform:translateY(-50%)}
.answer-arrow-marker.edge-right{right:1px;top:var(--slot-position);transform:translateY(-50%)}
.answer-arrow-marker.edge-top{top:1px;left:var(--slot-position);transform:translateX(-50%)}
.answer-arrow-marker.edge-bottom{bottom:1px;left:var(--slot-position);transform:translateX(-50%)}
.clue-inner{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden}
.clue-slot{display:flex;flex:1 1 0;min-height:0;overflow:hidden;padding:1px 2px;cursor:pointer;align-items:center;justify-content:center}
.clue-slot:hover{background:#7744bb14}.clue-slot.active-clue{background:#7744bb2e}
.slot-text{display:flex;width:100%;height:100%;flex:1 1 auto;align-items:center;justify-content:center;overflow:hidden;color:#443366;font-weight:600;line-height:1.15;text-align:center;word-break:normal;hyphens:none}
.clue-divider{height:1px;background:#9966cc;opacity:.6;flex-shrink:0;margin:0 2px}
.solve-input{position:relative;z-index:1;width:100%;height:100%;border:0;background:transparent;text-align:center;font-weight:600;color:#222;outline:none;text-transform:uppercase;display:block;cursor:text}
.solve-input:focus{background:#fffde0}.solve-input.wrong{background:#ffd0d8!important;color:#a01030}
.solve-input.in-active-word{background:#fff5b8}.solve-input.active-cell,.solve-input:focus.active-cell{background:#ffe680}
.loading-msg{padding:28px;text-align:center;color:#888}.notice{padding:10px 12px;margin-bottom:12px;border-radius:6px;background:#fff5b8;color:#654e00;font-size:13px}
#solver-print-pages{display:none}
@page{size:A4 portrait;margin:0}
@media print{
  html,body{width:210mm!important;margin:0!important;padding:0!important;background:#fff!important}
  body.solver-printing>*:not(#solver-print-pages){display:none!important}
  body.solver-printing #solver-print-pages{display:block!important}
  .print-page{width:210mm;height:297mm;box-sizing:border-box;padding:12mm;display:grid;grid-template-rows:auto 1fr;page-break-after:always;break-after:page;overflow:hidden;background:#fff;color:#111}
  .print-page:last-child{page-break-after:auto;break-after:auto}
  .print-title{font:700 17pt Arial,sans-serif;text-align:center;overflow-wrap:anywhere;padding:0 0 7mm}
  .print-grid-area{min-height:0;display:flex;align-items:center;justify-content:center}
  .print-svg{display:block;max-width:100%;max-height:100%;overflow:visible;print-color-adjust:exact;-webkit-print-color-adjust:exact}
}
.modal{display:none;position:fixed;inset:0;z-index:500;align-items:center;justify-content:center;padding:16px;background:#0009}
.modal.open{display:flex}.modal-box{width:100%;max-width:430px;padding:28px;border-radius:14px;background:#fff;text-align:center;box-shadow:0 8px 32px #0003}
.modal-box h2{margin:0 0 10px;color:#443366;font-size:20px}.modal-box p{margin:0 0 18px;color:#666;font-size:13px;line-height:1.5}
.modal-box button{width:100%;margin-top:8px;padding:11px;border:1px solid #ddd;border-radius:7px;background:#fff;cursor:pointer;font-weight:600}
.modal-box button.primary{border-color:#7744bb;background:#7744bb;color:#fff}.modal-box button.guest{color:#666}
.rating-box{max-width:460px}.stars{display:flex;justify-content:center;gap:8px;margin:14px 0}.star{font-size:36px;cursor:pointer;color:#f0a500;opacity:.3}.star.active{opacity:1}
.modal-box textarea{width:100%;min-height:82px;padding:10px;border:1px solid #ccc;border-radius:6px;font:13px Arial,sans-serif;resize:vertical}
.comment-types{display:flex;justify-content:center;gap:18px;margin:12px 0;font-size:13px}
.comment-buttons{display:flex;gap:8px}.comment-buttons button{flex:1}
@media(max-width:600px){main{margin:12px auto;padding:0 8px}.solver-body{padding:10px}.solver-header{padding:11px 12px}}
</style>
</head>
<body>
<nav>
  <a class="brand" href="index.html">Arrow<span>Word</span></a>
  <div class="nav-right">
    <button class="nav-signin" id="nav-signin" onclick="showSignIn()">Sign in</button>
    <div class="nav-user" id="nav-user"><img id="nav-avatar" src="" alt=""><span id="nav-name"></span><button onclick="sbSignOut()">Sign out</button></div>
  </div>

<main>
  <section class="solver-box">
    <header class="solver-header">
      <h1 id="solver-title">Loading puzzle…</h1>
      <span class="solver-timer" id="solver-timer">0:00</span>
      <button class="solver-close" onclick="closeSolver()">← Puzzles</button>
    </header>
    <div class="solver-body">
      <div id="solver-notice" class="notice" style="display:none"></div>
      <div class="solve-toolbar">
        <div class="solve-toolbar-left">
          <button class="blue" onclick="saveProgress()">💾 Save progress</button>
          <button onclick="solverCheck()">✓ Check answers</button>
          <button class="orange" onclick="openCommentModal()">💬 Comment / Report</button>
        </div>
        <div class="solve-toolbar-right">
          <button class="green" onclick="printSolverPuzzle()">🖨 Print</button>
          <button class="warn" onclick="solverClear()">Clear</button>
        </div>
      </div>
      <div class="zoom-bar">
        <span>Zoom:</span><button onclick="sZoomBy(-0.15)">−</button><button onclick="sSetZoom(1)">100%</button>
        <button onclick="sZoomBy(0.15)">+</button><button onclick="sZoomFit()">Fit</button><span id="s-zoom-val">100%</span>
      </div>
      <div class="grid-wrap" id="s-grid-wrap" onclick="gridWrapClick(event)">
        <div id="s-zoom-wrap" style="transform-origin:top left;display:inline-block"><table class="puzzle" id="s-grid"></table></div>
      </div>

</main>
<div class="modal open" id="signin-modal">
  <div class="modal-box">
    <h2>Sign in to track your progress</h2>
    <p>Sign in to save progress across devices. You can also continue as a guest; guest progress is saved in this browser.</p>
    <button class="primary" onclick="doSignIn('google')">Continue with Google</button>
    <button class="guest" onclick="continueAsGuest()">Continue as guest</button>
  </div>
</div>
<div class="modal" id="rating-modal">
  <div class="modal-box rating-box">
    <div style="font-size:42px">🎉</div><h2 id="completion-title">Puzzle complete!</h2>
    <p id="completion-msg">Congratulations! Please rate your experience.</p>
    <div class="stars">
      <span class="star" data-v="1" onclick="setStar(1)">★</span><span class="star" data-v="2" onclick="setStar(2)">★</span>
      <span class="star" data-v="3" onclick="setStar(3)">★</span><span class="star" data-v="4" onclick="setStar(4)">★</span>
      <span class="star" data-v="5" onclick="setStar(5)">★</span>
    </div>
    <textarea id="completion-comment" placeholder="Optional feedback or comments"></textarea>

    <button onclick="closeCompletionModal()">Close</button>

</div>

  <div class="modal-box">
    <h2>Send feedback</h2>
    <div class="comment-types">
      <label><input type="radio" name="comment-type" value="feedback" checked> Feedback</label>
      <label><input type="radio" name="comment-type" value="bug_report"> Bug report</label>
    </div>
    <textarea id="comment-text" placeholder="Tell us what you think…"></textarea>
    <div class="comment-buttons">
      <button class="primary" onclick="submitCommentReport()">Send</button><button onclick="closeCommentModal()">Cancel</button>
    </div>
  </div>
</div>

<script>
function escHtml(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function arrowSVG(dir,s){
  const c=s/2,m=Math.ceil(s*.12),e=s-m,sw=Math.max(1.6,s/12),ahLarge=s*.34,ahSmall=s*.25;
  function head(x,y,dx,dy,size='large'){const ah=size==='small'?ahSmall:ahLarge,l=Math.sqrt(dx*dx+dy*dy),nx=dx/l,ny=dy/l,px=-ny,py=nx;return`M${x-nx*ah+px*ah*.45},${y-ny*ah+py*ah*.45} L${x},${y} L${x-nx*ah-px*ah*.45},${y-ny*ah-py*ah*.45}`;}
  const paths={right:[`M${m},${c} L${e},${c}`,head(e,c,1,0)],left:[`M${e},${c} L${m},${c}`,head(m,c,-1,0)],down:[`M${c},${m} L${c},${e}`,head(c,e,0,1)],up:[`M${c},${e} L${c},${m}`,head(c,m,0,-1)],'right-down':[`M${m},${c} L${c},${c} L${c},${1.2*e-.2*c}`,head(c,1.2*e-.2*c,0,1,'small')],'down-right':[`M${c},${m} L${c},${c} L${1.2*e-.2*c},${c}`,head(1.2*e-.2*c,c,1,0,'small')],'left-down':[`M${e},${c} L${c},${c} L${c},${1.2*e-.2*c}`,head(c,1.2*e-.2*c,0,1,'small')],'down-left':[`M${c},${m} L${c},${c} L${1.2*m-.2*c},${c}`,head(1.2*m-.2*c,c,-1,0,'small')],'right-up':[`M${m},${c} L${c},${c} L${c},${1.2*m-.2*c}`,head(c,1.2*m-.2*c,0,-1,'small')],'up-right':[`M${c},${e} L${c},${c} L${1.2*e-.2*c},${c}`,head(1.2*e-.2*c,c,1,0,'small')],'left-up':[`M${e},${c} L${c},${c} L${c},${1.2*m-.2*c}`,head(c,1.2*m-.2*c,0,-1,'small')],'up-left':[`M${c},${e} L${c},${c} L${1.2*m-.2*c},${c}`,head(1.2*m-.2*c,c,-1,0,'small')]};
  const[p,a]=paths[dir]||paths.right;
  return`<svg width="${s}" height="${s}" viewBox="0 0 ${s} ${s}" xmlns="http://www.w3.org/2000/svg"><path d="${p}" stroke="#7744bb" stroke-width="${sw}" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="${a}" stroke="#7744bb" stroke-width="${sw}" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
function answerArrowSVG(dir,s){return arrowSVG(dir,s).replace(/stroke-width="[^"]+"/g,`stroke-width="${Math.max(1,s/16)}"`);}
function getWordCells(dir,ans,or,oc){
  const len=ans.length,cells=[];
  if(dir==='right'){for(let i=0;i<len;i++)cells.push([or,oc+1+i]);}
  else if(dir==='left'){for(let i=0;i<len;i++)cells.push([or,oc-len+i]);}
  else if(dir==='down'){for(let i=0;i<len;i++)cells.push([or+1+i,oc]);}
  else if(dir==='up'){for(let i=0;i<len;i++)cells.push([or-len+i,oc]);}
  else if(dir==='right-down'){cells.push([or,oc+1]);for(let i=1;i<len;i++)cells.push([or+i,oc+1]);}
  else if(dir==='down-right'){cells.push([or+1,oc]);for(let i=1;i<len;i++)cells.push([or+1,oc+i]);}
  else if(dir==='left-down'){cells.push([or,oc-1]);for(let i=1;i<len;i++)cells.push([or+i,oc-1]);}
  else if(dir==='down-left'){const t=[[or+1,oc]];for(let i=1;i<len;i++)t.push([or+1,oc-i]);t.sort((a,b)=>a[1]-b[1]);cells.push(...t);}
  else if(dir==='right-up'){const t=[[or,oc+1]];for(let i=1;i<len;i++)t.push([or-i,oc+1]);t.sort((a,b)=>a[0]-b[0]);cells.push(...t);}
  else if(dir==='up-right'){const t=[[or-1,oc]];for(let i=1;i<len;i++)t.push([or-1,oc+i]);cells.push(...t);}
  else if(dir==='left-up'){const t=[[or,oc-1]];for(let i=1;i<len;i++)t.push([or-i,oc-1]);t.sort((a,b)=>a[0]-b[0]);cells.push(...t);}
  else if(dir==='up-left'){const t=[[or-1,oc]];for(let i=1;i<len;i++)t.push([or-1,oc-i]);t.sort((a,b)=>a[1]-b[1]);cells.push(...t);}
  return cells;
}
function firstAnswerTarget(dir,or,oc){
  const steps={right:[0,1,'left'],left:[0,-1,'right'],down:[1,0,'top'],up:[-1,0,'bottom'],'right-down':[0,1,'left'],'down-right':[1,0,'top'],'left-down':[0,-1,'right'],'down-left':[1,0,'top'],'right-up':[0,1,'left'],'up-right':[-1,0,'bottom'],'left-up':[0,-1,'right'],'up-left':[-1,0,'bottom']};
  const[dr,dc,edge]=steps[dir]||steps.right;return{r:or+dr,c:oc+dc,edge};
}
function clueBoxWeight(cl){return Math.sqrt(Math.max(1,String(cl&&cl.clue||'?').trim().length));}
function getAnswerArrowMarkers(r,c,grid){
  const markers=[];
  for(let or=0;or<grid.length;or++)for(let oc=0;oc<(grid[or]||[]).length;oc++){
    const owner=grid[or][oc];if(owner.t!=='clue'||!Array.isArray(owner.clues)||!owner.clues.length)continue;
    const weights=owner.clues.map(clueBoxWeight),total=weights.reduce((a,b)=>a+b,0)||owner.clues.length;let consumed=0;
    owner.clues.forEach((cl,index)=>{const weight=weights[index]||1,target=firstAnswerTarget(cl.dir,or,oc);
      if(target.r===r&&target.c===c){const position=target.edge==='top'||target.edge==='bottom'?50:((consumed+weight/2)/total)*100;markers.push({dir:cl.dir,edge:target.edge,position});}
      consumed+=weight;
    });
  }
  return markers;
}
function appendAnswerArrowMarkers(td,r,c,grid,cellPx){
  const markerSize=Math.max(8,Math.round(cellPx*.25));
  getAnswerArrowMarkers(r,c,grid).forEach(marker=>{const el=document.createElement('span');el.className='answer-arrow-marker edge-'+marker.edge;el.style.setProperty('--arrow-size',markerSize+'px');el.style.setProperty('--slot-position',marker.position+'%');el.innerHTML=answerArrowSVG(marker.dir,markerSize);td.appendChild(el);});
}

let sWords=[],sActive=null,sCurZoom=1,sCurPuzzleId=null,sPrintGrid=null,sPrintRows=0,sPrintCols=0,sPrintCellSizePx=64,sPrintTextSizePx=12;
let _cloudProgress={},_checkCounts={},_timerInterval=null,_timerSeconds=0,_timerStarted=false,_autoSaveInterval=null,_lastSavedAnswers='',_selectedRating=0,_requestedSolverId=new URLSearchParams(location.search).get('id'),_solverLoading=false;
function setNotice(message){const el=document.getElementById('solver-notice');el.textContent=message;el.style.display=message?'block':'none';}
function showSignIn(){document.getElementById('signin-modal').classList.add('open');}
async function doSignIn(provider){document.getElementById('signin-modal').classList.remove('open');try{if(provider==='google')await sbSignInGoogle();else if(provider==='facebook')await sbSignInFacebook();}catch(e){alert('Sign-in failed: '+(e.message||e));showSignIn();}}
function continueAsGuest(){sessionStorage.setItem('guest_mode','1');document.getElementById('signin-modal').classList.remove('open');if(_requestedSolverId)openSolver(_requestedSolverId);}
function gridWrapClick(e){if(e.target.closest('td.t-empty')||e.target.closest('td.t-black')||e.target===document.getElementById('s-grid-wrap')||e.target===document.getElementById('s-zoom-wrap')){sActive=null;sHighlight();}}
function startRequestedPuzzle(){
  if(!_requestedSolverId){document.getElementById('solver-title').textContent='No puzzle selected';setNotice('Choose a puzzle from the directory to start solving.');document.getElementById('signin-modal').classList.remove('open');return;}
  if(sbGetUser()||sessionStorage.getItem('guest_mode')==='1'){document.getElementById('signin-modal').classList.remove('open');openSolver(_requestedSolverId);}
  else{document.getElementById('signin-modal').classList.add('open');}
}
async function openSolver(id){
  if(_solverLoading||sCurPuzzleId===id&&sPrintGrid)return;
  _solverLoading=true;sCurPuzzleId=id;_checkCounts[id]=_checkCounts[id]||0;resetTimer();_lastSavedAnswers='';setNotice('');
  document.getElementById('solver-title').textContent='Loading…';document.getElementById('s-grid').innerHTML='<tr><td class="loading-msg">Loading puzzle…</td></tr>';
  history.replaceState(null,'','?id='+encodeURIComponent(id));
  try{
    const entry=await cloudGetPuzzle(id);if(!entry||!entry.data)throw new Error('Puzzle data not found');
    document.title=(entry.title||'Puzzle')+' — Arrow Word Solver';document.getElementById('solver-title').textContent=entry.title||'Puzzle';
    buildSolverGrid(entry.data);setTimeout(()=>{sZoomFit();fitSolverText();},80);
    let answers=null,progress=null;
    if(sbGetUser()){try{progress=await sbLoadProgress(id);if(progress){if(progress.answers)answers=progress.answers;_checkCounts[id]=progress.check_count||0;if(progress.time_spent_seconds){_timerSeconds=progress.time_spent_seconds;const m=Math.floor(_timerSeconds/60),s=_timerSeconds%60;document.getElementById('solver-timer').textContent=m+':'+String(s).padStart(2,'0');}}}catch(e){console.warn('Cloud progress could not be restored:',e);}}
    if(!answers){try{const local=JSON.parse(localStorage.getItem('arrowword_progress')||'{}');if(local[id])answers=local[id].answers;}catch(e){}}
    if(answers)Object.entries(answers).forEach(([key,val])=>{const[r,c]=key.split(',').map(Number),inp=sGetInp(r,c);if(inp)inp.value=val;});
    startAutoSave();
  }catch(e){document.getElementById('s-grid').innerHTML='<tr><td class="loading-msg" style="color:#b00">Could not load puzzle: '+escHtml(e.message)+'</td></tr>';}
  finally{_solverLoading=false;}
}
async function closeSolver(){
  if(sCurPuzzleId){const answers={};document.querySelectorAll('#s-grid input.solve-input').forEach(inp=>{if(inp.value)answers[inp.dataset.r+','+inp.dataset.c]=inp.value;});if(Object.keys(answers).length&&!(_cloudProgress[sCurPuzzleId]&&_cloudProgress[sCurPuzzleId].complete))await _silentSave(answers);if(sbGetUser()&&_timerSeconds>0)await sbSaveTimeSpent(sCurPuzzleId,_timerSeconds%60);}
  stopTimer();stopAutoSave();location.href='directory.html';
}
async function saveProgress(){
  if(!sCurPuzzleId)return;const answers={};document.querySelectorAll('#s-grid input.solve-input').forEach(inp=>{if(inp.value)answers[inp.dataset.r+','+inp.dataset.c]=inp.value;});
  const local=JSON.parse(localStorage.getItem('arrowword_progress')||'{}');local[sCurPuzzleId]={answers,savedAt:Date.now()};localStorage.setItem('arrowword_progress',JSON.stringify(local));
  if(sbGetUser()){await sbSaveProgress(sCurPuzzleId,answers,false,_checkCounts[sCurPuzzleId]||0);if(!_cloudProgress[sCurPuzzleId]||!_cloudProgress[sCurPuzzleId].complete)_cloudProgress[sCurPuzzleId]={complete:false};}
  const btn=document.querySelector('.solve-toolbar-left .blue');if(btn){const old=btn.textContent;btn.textContent='✓ Saved!';setTimeout(()=>btn.textContent=old,1500);}forceResetHighlights();
}
function forceResetHighlights(){document.querySelectorAll('#s-grid input').forEach(inp=>{inp.style.background='';});document.querySelectorAll('.clue-slot.active-clue').forEach(el=>el.classList.remove('active-clue'));sActive=null;}
function buildSolverGrid(data){
  const rows=data.rows,cols=data.cols,cSz=data.cellSizePx||64,tSz=data.textSizePx||12; sPrintTextSizePx=tSz;sWords=[];sActive=null;

function getRenderedSolverClueLayout(r,c,index){
  const slot=document.querySelector('#s-grid .clue-slot[data-or="'+r+'"][data-oc="'+c+'"][data-ci="'+index+'"]'),text=slot&&slot.querySelector('.slot-text');

function printSolverPuzzle(){
  if(!sPrintGrid||!sPrintGrid.length||!sPrintRows||!sPrintCols){alert('There is no puzzle grid to print yet.');return;}fitSolverText();
  const pages=document.getElementById('solver-print-pages')||document.body.appendChild(document.createElement('div'));pages.id='solver-print-pages';pages.replaceChildren();
  const pageName=(document.getElementById('solver-title').textContent||'').trim()||'Untitled puzzle',availableWidth=(210-24)/25.4*96,availableHeight=(297-24-18)/25.4*96;

        const markerSize=Math.max(6,printCellSize*.25);let markerX=x+printCellSize/2-markerSize/2,markerY=y+printCellSize/2-markerSize/2;
        if(marker.edge==='left'){markerX=x+1.5*scale;markerY=y+printCellSize*marker.position/100-markerSize/2;}
        else if(marker.edge==='right'){markerX=x+printCellSize-markerSize-1.5*scale;markerY=y+printCellSize*marker.position/100-markerSize/2;}
        else if(marker.edge==='top'){markerX=x+printCellSize*marker.position/100-markerSize/2;markerY=y+1.5*scale;}
        else{markerX=x+printCellSize*marker.position/100-markerSize/2;markerY=y+printCellSize-markerSize-1.5*scale;}

          slot.style.cssText='width:100%;height:100%;box-sizing:border-box;display:flex;overflow:hidden;padding:1px 2px;align-items:center;justify-content:center;';
          const text=document.createElementNS(htmlNS,'div'),screenLayout=getRenderedSolverClueLayout(r,c,index);text.textContent=screenLayout&&screenLayout.lines.length?screenLayout.lines.join('\n'):(cl.clue||'?');
          text.style.cssText='font-family:Arial,sans-serif;font-weight:600;color:#222;line-height:1.15;text-align:center;overflow:hidden;overflow-wrap:normal;word-break:normal;hyphens:none;min-width:0;min-height:0;width:100%;flex:1 1 auto;';
          if(screenLayout&&screenLayout.lines.length>1)text.style.whiteSpace='pre-line';
          const printTextScale=screenLayout?Math.min(Math.max(1,printCellSize-inset*2-4)/screenLayout.width,Math.max(1,slotHeight-inset*2-2)/screenLayout.height):scale;
          text.style.fontSize=((screenLayout&&screenLayout.fontSize||sPrintTextSizePx)*printTextScale)+'px';slot.appendChild(text);fo.appendChild(slot);svg.appendChild(fo);slotY+=slotHeight;
        });

    }
    const lineWidth=1.1;for(let c=0;c<=sPrintCols;c++){const x=c===0?lineWidth/2:c===sPrintCols?width-lineWidth/2:c*printCellSize;svg.appendChild(svgNode('line',{x1:x,y1:0,x2:x,y2:height,stroke:'#222','stroke-width':lineWidth,'shape-rendering':'crispEdges'}));}

function fitSolverText(){document.querySelectorAll('#s-grid .clue-slot').forEach(slot=>{const t=slot.querySelector('.slot-text');if(!t)return;let fs=parseFloat(t.style.fontSize)||10,s=40;while(s-->0&&fs>4&&(slot.scrollWidth>slot.clientWidth+1||slot.scrollHeight>slot.clientHeight+1)){fs-=.5;t.style.fontSize=fs+'px';}});}
function sGetInp(r,c){return document.querySelector('#s-grid input.solve-input[data-r="'+r+'"][data-c="'+c+'"]');}
function sPickClue(or,oc,ci){const w=sWords.find(x=>x.or===or&&x.oc===oc&&x.ci===ci);if(!w)return;sActive={or,oc,ci,cells:w.cells,ans:w.ans,idx:0};sHighlight();const inp=sGetInp(w.cells[0][0],w.cells[0][1]);if(inp){inp.focus();inp.select();}}
function sHighlight(){
  document.querySelectorAll('#s-grid .solve-input').forEach(i=>i.classList.remove('in-active-word','active-cell'));document.querySelectorAll('#s-grid .clue-slot').forEach(s=>s.classList.remove('active-clue'));if(!sActive)return;
  sActive.cells.forEach(([r,c],i)=>{const inp=sGetInp(r,c);if(inp){inp.classList.add('in-active-word');if(i===sActive.idx)inp.classList.add('active-cell');}});
  const slot=document.querySelector('#s-grid .clue-slot[data-or="'+sActive.or+'"][data-oc="'+sActive.oc+'"][data-ci="'+sActive.ci+'"]');if(slot)slot.classList.add('active-clue');
}
function sSolveFocus(e){const inp=e.target;inp.classList.remove('wrong');const r=+inp.dataset.r,c=+inp.dataset.c;if(sActive){const i=sActive.cells.findIndex(([a,b])=>a===r&&b===c);if(i>=0){sActive.idx=i;sHighlight();return;}}const w=sWords.find(x=>x.cells.some(([a,b])=>a===r&&b===c));if(w){sActive={or:w.or,oc:w.oc,ci:w.ci,cells:w.cells,ans:w.ans,idx:w.cells.findIndex(([a,b])=>a===r&&b===c)};if(sActive.idx<0)sActive.idx=0;sHighlight();}}
function sSolveInput(e){const inp=e.target;inp.value=(inp.value||'').slice(-1).toUpperCase().replace(/[^A-Z]/,'');inp.classList.remove('wrong');if(inp.value&&sActive){const next=sActive.idx+1;if(next<sActive.cells.length){sActive.idx=next;const[nr,nc]=sActive.cells[next],ni=sGetInp(nr,nc);if(ni){ni.focus();ni.select();}}else sHighlight();}sMaybeCelebrate();}
function sSolveKeydown(e){const inp=e.target;if(e.key==='Backspace'){if(inp.value)return;if(sActive&&sActive.idx>0){e.preventDefault();sActive.idx--;const[pr,pc]=sActive.cells[sActive.idx],pi=sGetInp(pr,pc);if(pi){pi.value='';pi.classList.remove('wrong');pi.focus();pi.select();}}}else if(e.key==='ArrowRight'||e.key==='ArrowDown'){if(sActive&&sActive.idx<sActive.cells.length-1){e.preventDefault();sActive.idx++;const[nr,nc]=sActive.cells[sActive.idx],ni=sGetInp(nr,nc);if(ni){ni.focus();ni.select();}}}else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){if(sActive&&sActive.idx>0){e.preventDefault();sActive.idx--;const[pr,pc]=sActive.cells[sActive.idx],pi=sGetInp(pr,pc);if(pi){pi.focus();pi.select();}}}else if(e.key==='Escape'){sActive=null;sHighlight();inp.blur();}}
async function sMaybeCelebrate(){
  if(!sWords.length)return;for(const w of sWords)for(let i=0;i<w.cells.length;i++){const[r,c]=w.cells[i],inp=sGetInp(r,c);if(!inp||(inp.value||'').toUpperCase()!==w.ans[i])return;}

  if(sCurPuzzleId){const answers={};document.querySelectorAll('#s-grid input.solve-input').forEach(inp=>{if(inp.value)answers[inp.dataset.r+','+inp.dataset.c]=inp.value;});
    const complete=JSON.parse(localStorage.getItem('arrowword_complete')||'{}');complete[sCurPuzzleId]=Date.now();localStorage.setItem('arrowword_complete',JSON.stringify(complete));
    const prog=JSON.parse(localStorage.getItem('arrowword_progress')||'{}');delete prog[sCurPuzzleId];localStorage.setItem('arrowword_progress',JSON.stringify(prog));
    _cloudProgress[sCurPuzzleId]={complete:true};

  }

}
async function solverCheck(){
  let wrong=0,filled=0;document.querySelectorAll('#s-grid td.t-answer input').forEach(inp=>{const r=+inp.dataset.r,c=+inp.dataset.c,got=(inp.value||'').toUpperCase();if(!got){inp.classList.remove('wrong');return;}filled++;const w=sWords.find(x=>x.cells.some(([a,b])=>a===r&&b===c));if(!w)return;const idx=w.cells.findIndex(([a,b])=>a===r&&b===c);if(got!==w.ans[idx]){inp.classList.add('wrong');wrong++;}else inp.classList.remove('wrong');});
  sActive=null;sHighlight();if(sCurPuzzleId){_checkCounts[sCurPuzzleId]=(_checkCounts[sCurPuzzleId]||0)+1;if(sbGetUser())await sbIncrementCheckCount(sCurPuzzleId);}
  if(!filled)alert('No letters typed yet.');else alert((filled-wrong)+' correct, '+wrong+' wrong (out of '+filled+' typed).');forceResetHighlights();
}
function solverClear(){if(!confirm('Clear all your answers?'))return;document.querySelectorAll('#s-grid .solve-input').forEach(i=>{i.value='';i.classList.remove('wrong');});sActive=null;sHighlight();}
function sApplyZoom(){const w=document.getElementById('s-zoom-wrap');if(!w)return;w.style.transform='scale('+sCurZoom+')';document.getElementById('s-zoom-val').textContent=Math.round(sCurZoom*100)+'%';const tbl=document.getElementById('s-grid');if(tbl&&tbl.offsetWidth){w.style.width=(tbl.offsetWidth*sCurZoom)+'px';w.style.height=(tbl.offsetHeight*sCurZoom)+'px';}}

function startTimer(){if(_timerStarted)return;_timerStarted=true;_timerInterval=setInterval(()=>{_timerSeconds++;const m=Math.floor(_timerSeconds/60),s=_timerSeconds%60;document.getElementById('solver-timer').textContent=m+':'+String(s).padStart(2,'0');},1000);}

function setStar(v){_selectedRating=v;document.querySelectorAll('.star').forEach(s=>s.classList.toggle('active',+s.dataset.v<=v));}

async function submitCommentReport(){const comment=(document.getElementById('comment-text').value||'').trim(),type=document.querySelector('input[name="comment-type"]:checked').value;if(!comment){alert('Please enter a comment.');return;}if(!sbGetUser()){alert('Please sign in to submit feedback.');return;}if(!sCurPuzzleId){alert('No puzzle selected.');return;}try{if(await sbSaveComment(sCurPuzzleId,comment,type)){alert('Thank you! Your feedback has been recorded.');closeCommentModal();}else alert('Failed to save comment. Please try again.');}catch(e){alert('Error: '+(e.message||'Failed to save comment'));}}
sbOnUserChanged(async user=>{
  const pill=document.getElementById('nav-user'),signin=document.getElementById('nav-signin');
  if(user){pill.style.display='flex';signin.style.display='none';document.getElementById('nav-name').textContent=user.user_metadata?.full_name||user.email||'';document.getElementById('nav-avatar').src=user.user_metadata?.avatar_url||'';try{_cloudProgress=await sbLoadAllProgress();}catch(e){console.warn('Progress load failed:',e);}if(_requestedSolverId&&!sCurPuzzleId)startRequestedPuzzle();}

});
if(_requestedSolverId){setTimeout(startRequestedPuzzle,250);}else{document.getElementById('solver-title').textContent='No puzzle selected';setNotice('Choose a puzzle from the directory to start solving.');document.getElementById('signin-modal').classList.remove('open');}
