<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- ArrowWord Directory v23: puzzle catalogue is separated from the solver page. -->
<title>Puzzle Directory — Arrow Word Puzzles</title>
<link rel="icon" href="favicon.png">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#f5f0ff;color:#222;font-family:Arial,sans-serif}
nav{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:#7744bb;color:#fff;padding:12px 24px}
.brand{color:#fff;text-decoration:none;font-size:20px;font-weight:700}.brand span{color:#e8d8ff}
.nav-right{display:flex;align-items:center;gap:12px}
.nav-user{display:none;align-items:center;gap:8px}
.nav-user img{width:26px;height:26px;border-radius:50%;object-fit:cover}
.nav-user span{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.nav-user button{border:0;border-radius:14px;padding:5px 10px;color:#fff;background:#ffffff2b;cursor:pointer}
.page-header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;background:white;border-bottom:1px solid #e8e0f0;padding:20px 24px}
h1{margin:0;color:#443366;font-size:22px}.page-header p{margin:5px 0 0;color:#888;font-size:13px}
.create-link{padding:10px 16px;border-radius:7px;background:#7744bb;color:#fff;text-decoration:none;font-size:14px;font-weight:600}
main{max-width:1000px;margin:0 auto;padding:24px}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.toolbar input{flex:1;min-width:180px;padding:9px 12px;border:1px solid #ccc;border-radius:6px;font-size:14px}
.toolbar select,.toolbar button{padding:9px 11px;border:1px solid #bbb;border-radius:6px;background:#fff;font-size:13px}
.toolbar button{cursor:pointer}.size-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.size-tab{padding:6px 13px;border:1px solid #ccc;border-radius:20px;background:#fff;color:#666;font-weight:600;font-size:12px;cursor:pointer}
.size-tab.active{background:#7744bb;color:#fff;border-color:#7744bb}
.count-line{margin-bottom:9px;color:#999;font-size:12px}
.group-section{margin:0 0 28px}.group-title{margin-bottom:12px;padding-bottom:6px;border-bottom:2px solid #e8e0f0;color:#443366;font-weight:700}
.puzzle-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.pcard{display:flex;flex-direction:column;gap:8px;position:relative;padding:18px;border:1px solid #e0d8f0;border-radius:10px;background:#fff}
.pcard-title{color:#443366;font-size:15px;font-weight:700;line-height:1.3}.pcard-meta,.pcard-credit{color:#999;font-size:11px}
.pcard-size{align-self:flex-start;border-radius:4px;background:#f0ecff;padding:3px 8px;color:#777;font-size:11px}
.pcard-badge{position:absolute;top:10px;right:10px;padding:3px 8px;border-radius:12px;font-size:10px;font-weight:700}
.badge-complete{background:#d4edda;color:#155724}.badge-inprogress{background:#fff3cd;color:#856404}
.puzzle-rating{color:#d99100;font-size:11px}
.btn-solve{display:block;margin-top:4px;padding:10px;border-radius:6px;background:#7744bb;color:#fff;text-align:center;text-decoration:none;font-size:13px;font-weight:600}
.empty-state,.loading{text-align:center;padding:54px 20px;color:#999}
.empty-state button{margin-top:12px;padding:8px 14px;border:0;border-radius:6px;background:#7744bb;color:#fff;cursor:pointer}
@media(max-width:600px){main{padding:16px}.page-header{padding:17px 16px}.toolbar input{flex-basis:100%}}
</style>
</head>
<body>
<nav>
  <a class="brand" href="index.html">Arrow<span>Word</span></a>
  <div class="nav-right">
    <div class="nav-user" id="nav-user">
      <img id="nav-avatar" src="" alt="">
      <span id="nav-name"></span>
      <button onclick="sbSignOut()">Sign out</button>
    </div>
  </div>
</nav>
<header class="page-header">
  <div><h1>🧩 Puzzle Directory</h1><p>Choose a puzzle to open it on the dedicated solver page.</p></div>
  <a class="create-link" href="builder.html">+ Create puzzle</a>
</header>
<main>
  <div class="toolbar">
    <input id="search" type="search" placeholder="Search puzzles…" oninput="renderDir()">
    <select id="sort-by" onchange="renderDir()">
      <option value="alpha">A–Z</option><option value="newest">Newest first</option><option value="oldest">Oldest first</option>
    </select>
    <button onclick="loadDir()">↻ Refresh</button>
  </div>
  <div class="size-tabs" id="size-tabs"></div>
  <div class="count-line" id="count-line"></div>
  <div id="dir-content"><div class="loading">Loading puzzles…</div></div>
</main>
<script src="cloud-storage.js?v=20260532"></script>
<script src="supabase-auth.js?v=20260532"></script>
<script>
function escHtml(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
let allPuzzles=[],activeSize='all',_cloudProgress={},_puzzleRatings={};
function getSizeLabel(p){return p.cols&&p.rows?p.cols+'×'+p.rows:'?×?';}
function getPuzzleStatus(id){
  if(_cloudProgress[id]&&_cloudProgress[id].complete)return'complete';
  if(_cloudProgress[id])return'inprogress';
  try{
    const complete=JSON.parse(localStorage.getItem('arrowword_complete')||'{}');
    if(complete[id])return'complete';
    const progress=JSON.parse(localStorage.getItem('arrowword_progress')||'{}');
    if(progress[id])return'inprogress';
  }catch(e){}
  return'new';
}
async function loadDir(){
  const content=document.getElementById('dir-content');
  content.innerHTML='<div class="loading">Loading puzzles…</div>';
  let timeoutId;
  try{
    if(typeof cloudGetIndex!=='function')throw new Error('The puzzle data service did not load (cloud-storage.js). Check that it is beside directory.html.');
    allPuzzles=await Promise.race([
      cloudGetIndex(),
      new Promise((_,reject)=>{timeoutId=setTimeout(()=>reject(new Error('The puzzle data request timed out. Check the network connection and try again.')),15000);})
    ]);
    clearTimeout(timeoutId);
    if(!Array.isArray(allPuzzles))throw new Error('The puzzle service returned an unexpected response.');
    buildSizeTabs();renderDir();
  }catch(e){clearTimeout(timeoutId);content.innerHTML='<div class="empty-state">Could not load puzzles.<br><small>'+escHtml(e.message||'Unknown error')+'</small><br><button onclick="loadDir()">Try again</button></div>';}
}
function buildSizeTabs(){
  const counts={};allPuzzles.forEach(p=>{const s=getSizeLabel(p);counts[s]=(counts[s]||0)+1;});
  const sizes=Object.keys(counts).sort((a,b)=>{const [ac,ar]=a.split('×').map(Number),[bc,br]=b.split('×').map(Number);return ac*ar-bc*br;});
  const tabs=document.getElementById('size-tabs');tabs.innerHTML='';
  if(sizes.length<=1){tabs.style.display='none';return;}
  tabs.style.display='flex';
  const addTab=(value,label)=>{const b=document.createElement('button');b.className='size-tab'+(activeSize===value?' active':'');b.textContent=label;b.onclick=()=>{activeSize=value;buildSizeTabs();renderDir();};tabs.appendChild(b);};
  addTab('all','All ('+allPuzzles.length+')');sizes.forEach(s=>addTab(s,s+' ('+counts[s]+')'));
}
function cardHtml(p){
  const status=getPuzzleStatus(p.id);
  const badge=status==='complete'?'<span class="pcard-badge badge-complete">✓ Completed</span>':status==='inprogress'?'<span class="pcard-badge badge-inprogress">⏳ In progress</span>':'';
  const label=status==='inprogress'?'▶ Continue solving':status==='complete'?'↺ Solve again':'Solve →';
  const rating=_puzzleRatings[p.id];
  const stars=rating?'<div class="puzzle-rating">'+('★'.repeat(Math.round(rating.avg_rating||0)))+('☆'.repeat(5-Math.round(rating.avg_rating||0)))+' '+Number(rating.avg_rating||0).toFixed(1)+'</div>':'';
  const href='solver.html?id='+encodeURIComponent(p.id);
  return '<article class="pcard">'+badge+
    '<div class="pcard-title">'+escHtml(p.title||'(Untitled)')+'</div>'+
    '<div class="pcard-meta">Published '+escHtml(p.publishedAt||'')+'</div>'+
    (p.builder_name?'<div class="pcard-credit">by '+escHtml(p.builder_name)+'</div>':'')+
    stars+(p.cols&&p.rows?'<div class="pcard-size">'+escHtml(getSizeLabel(p))+' grid</div>':'')+
    '<a class="btn-solve" href="'+escHtml(href)+'">'+label+'</a></article>';
}
function renderDir(){
  const q=(document.getElementById('search').value||'').toLowerCase();
  const sort=document.getElementById('sort-by').value;
  let list=allPuzzles.filter(p=>p&&p.id&&(!q||(p.title||'').toLowerCase().includes(q))&&(activeSize==='all'||getSizeLabel(p)===activeSize));
  if(sort==='newest')list.sort((a,b)=>(b.publishedAtMs||0)-(a.publishedAtMs||0));
  else if(sort==='oldest')list.sort((a,b)=>(a.publishedAtMs||0)-(b.publishedAtMs||0));
  else list.sort((a,b)=>(a.title||'').localeCompare(b.title||''));
  document.getElementById('count-line').textContent=list.length+' puzzle'+(list.length===1?'':'s');
  const content=document.getElementById('dir-content');
  if(!list.length){content.innerHTML='<div class="empty-state">'+(q?'No puzzles match your search.':'No puzzles published yet.')+'</div>';return;}
  const sizes=[...new Set(list.map(getSizeLabel))];
  if(activeSize==='all'&&sizes.length>1&&!q&&sort==='alpha'){
    content.innerHTML=sizes.sort().map(s=>{const group=list.filter(p=>getSizeLabel(p)===s);return'<section class="group-section"><div class="group-title">'+escHtml(s)+' grid · '+group.length+' puzzle'+(group.length===1?'':'s')+'</div><div class="puzzle-grid">'+group.map(cardHtml).join('')+'</div></section>';}).join('');
  }else content.innerHTML='<div class="puzzle-grid">'+list.map(cardHtml).join('')+'</div>';
}
loadDir();
if(typeof sbOnUserChanged==='function')sbOnUserChanged(async user=>{
  const pill=document.getElementById('nav-user'),name=document.getElementById('nav-name'),avatar=document.getElementById('nav-avatar');
  if(user){
    pill.style.display='flex';name.textContent=user.user_metadata?.full_name||user.email||'';avatar.src=user.user_metadata?.avatar_url||'';
    try{_cloudProgress=await sbLoadAllProgress();_puzzleRatings=await sbGetRatings().catch(()=>({}));}catch(e){console.warn('Progress status could not be loaded:',e);}
  }else{pill.style.display='none';_cloudProgress={};}
  renderDir();
});
</script>
</body>
</html>
